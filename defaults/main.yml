---
# defaults file for ninux-common
common_ipv4_forward: 0
common_ssh_port: 2400

# --- SSH hardening (all overridable per host/group) -------------------------
# prohibit-password = root may log in by key only (passwords already disabled).
# Set to "no" to forbid root SSH entirely, or "yes" for the old behaviour.
common_permit_root_login: "prohibit-password"
common_ssh_max_auth_tries: 3
common_ssh_max_sessions: 4
common_ssh_deny_users:
  - ubuntu

# --- sudoers ----------------------------------------------------------------
base_svr_groups:
  - name: michele
    groupid: 30000
    sudo: true
  - name: marco
    groupid: 31000
    sudo: true
  - name: federico
    groupid: 32000
    sudo: true
  - name: nino
    groupid: 33000
    sudo: true
